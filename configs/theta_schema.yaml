      CHANNELS_WIDTH: 17.62
      LEN: 2513.01
      AMPLITUDE: 1648.3
      RELATIVE: 0.45
      PROP: 0.7
  1:
    description: "Толстые тела со средним радиусом"
    values:
      THICK: 17.0
      MAJ_R: 2946.0
      AZIMUTH: 69.44
      NUMBER_CHANNELS: 10.0
      CHANNELS_WIDTH: 17.45
      LEN: 2484.95
      AMPLITUDE: 1636.63
      RELATIVE: 0.45
      PROP: 0.7
  2:
    description: "Толстые тела с малым радиусом"
    values:
      THICK: 12.49
      MAJ_R: 3450.76
      AZIMUTH: 68.16
      NUMBER_CHANNELS: 10.06
      CHANNELS_WIDTH: 17.19
      LEN: 2515.59
      AMPLITUDE: 1702.77
      RELATIVE: 0.45
      PROP: 0.7

# Workflow controls (ТЗ §3 workflow_params.csv 150×12) are NOT present for this
# dataset. ES updates θ only; `u` is None. This is consciously documented here
# so reviewers can audit the design choice.
controls:
  available: false
  reason: "workflow_params.csv (150 × 12) absent from input data."
